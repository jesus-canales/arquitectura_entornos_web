<html>
    <head>
        <title>Segundo Ejemplo de Formulario</title>
    </head>
    <body>
        <center>
            <H1>Formulario de Registro</H1>
            <h3>Completa o rellena los siguientes datos personales en el formulario</h3>
        </center>
        <form>
            <p>
                <label><b>Ingrese nombres:</b></label><br>
                <input type="text" name="nombres" placeholder="Ejemplo: Oscar Ramíro" required size="60">
            </p>
            <p>
                <label><b>Ingrese Apellidos:</b></label><br>
                <input type="text" name="apellidos" placeholder="Ejemplo: Reyes Acuña" required size="60">
            </p>
            <!-- Agregar el ingreso de correo electrónico y número de celular -->
             <p>
				<label><b>Ingrese celular:</b></label><br>
				<input type="text" name="tel" placeholder="Ejemplo: Son 9 dígitos y el primero es el 9" required size="60">
			</p>
			<p>
				<label><b>Ingrese correo electrónico:</b></label><br>
				<input type="text" name="email" placeholder="Ejemplo: alexa@dominio.com" required size="60">
			</p>
            <!-- Permitir seleccionar el género de la persona: Masculino - Femenino-->

        </form>
    </body>
</html>
