<html>

<head>
    <title>Segundo Ejemplo de Formulario</title>
</head>

<body>
    <center>
        <H1>Formulario de Registro</H1>
        <h3>Completa o rellena los siguientes datos personales en el formulario</h3>
    </center>
    <form>
        <fieldset>
            <legend>Información Personal</legend>
            <p>
                <label><b>Ingrese nombres:</b></label><br>
                <input type="text" name="nombres" placeholder="Ejemplo: Oscar Ramíro" required size="60">
            </p>
            <p>
                <label><b>Ingrese Apellidos:</b></label><br>
                <input type="text" name="apellidos" placeholder="Ejemplo: Reyes Acuña" required size="60">
            </p>
            <!-- Agregar el ingreso de correo electrónico y número de celular -->
            <p>
                <label><b>Ingrese celular:</b></label><br>
                <input type="text" name="tel" placeholder="Ejemplo: Son 9 dígitos y el primero es el 9" required
                    size="60">
            </p>
            <p>
                <label><b>Ingrese correo electrónico:</b></label><br>
                <input type="text" name="email" placeholder="Ejemplo: alexa@dominio.com" required size="60">
            </p>
            <!-- Permitir seleccionar el género de la persona: Masculino - Femenino-->
            <P>
                <label><b>Seleccione su Género:</b></label><br>
                <input type="radio" NAME="GENERO" VALUE="MASCULINO">
                <label>Masculino</label>
                <input type="radio" NAME="GENERO" VALUE="FEMENINO">
                <label>Femenino</label>
            </p>
            <p>
                <label><b>Ingrese su fecha de nacimiento:</b></label><br>
                <input type="date" name="fecha-nacimiento" required size="60">
            </p>
        </fieldset>
        <br><br>
        <fieldset>
            <legend>Datos de Accseso</legend>
            <p>
                <label><b>Nombre de usuario:</b></label><br>
                <input type="text" name="nombre" placeholder="Ejemplo: rapidos-yfuriosos" required size="60">
            </p>
            <p>
                <label><b>Ingrese su contraseña:</b></label><br>
                <input type="password" name="contraseña"
                    placeholder="Ejemplo: Debe tener mínimo 8 y máximo 20 caracteres" required size="60">
            </p>
        </fieldset>
        <br><br>
        <fieldset>
            <legend><b>Perfil del estudiante:</b></legend>
            <p>
                <label><b>Seleccione el distrito de procedencia:</b></label><br>
                <select name="distritos">
                    <option value="">-- Selecciona tu distrito --</option>
                    <option value="San-Antonio">San Antonio</option>
                    <option value="San-Vicente">San Vicente</option>
                    <option value="Imperial">Imperial</option>
                    <option value="Zúñiga">Zúñiga</option>
                    <option value="Santa-Cruz-de-Flores">Santa Cruz de Flores</option>
                    <option value="Nuevo-Imperial">Nuevo Imperial</option>
                    <option value="Mala">Mala</option>
                    <option value="Quilmana">Quilmaná</option>
                </select>
            </p>
            <p>
                <label><b>Selelecciona los deportes de tu interés:</b></label><br>
                <input type="checkbox" name="futbol" value="futbol">Fútbol <br>
                <input type="checkbox" name="voley" value="voley">Voley <br>
                <input type="checkbox" name="basquet" value="basquet">Basquet <br>

            </p>
        </fieldset>
    </form>
</body>

</html>
